<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 627.96 140.31" role="img" aria-label="Elvora">
  <!--
    Helle Fassung fuer farbige Flaechen.

    Der Schriftzug im Original laeuft von Violett (#725bcd) ueber Magenta
    nach Orange. Auf der dunklen Tafel #16193a kommt das erste Drittel,
    also "ELV", auf ein Kontrastverhaeltnis von etwa 3,4:1 und saeuft
    sichtbar ab, waehrend "ORA" leuchtet. Das Wort zerfaellt dadurch optisch
    in zwei Haelften.

    Deshalb steht der Schriftzug hier in Weiss, die Bildmarke behaelt ihre
    Verlaeufe. Das ist die uebliche Umkehrfassung: die Marke traegt die
    Farbe, das Wort traegt die Lesbarkeit.

    Die Pfade sind Zeichen fuer Zeichen dieselben wie in logo.svg. Geaendert
    wurden ausschliesslich die Fuellungen der sechs Buchstaben, und die
    nicht mehr benoetigten Verlaufsdefinitionen sind entfallen.
  -->
  <defs>
    <linearGradient id="elvh-mark-a" x1="48.7" y1="8.08" x2="85.52" y2="73.15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5c67db"/>
      <stop offset="1" stop-color="#7944d0"/>
    </linearGradient>
    <linearGradient id="elvh-mark-b" x1="91.59" y1="36.08" x2="86.01" y2="128.67" gradientUnits="userSpaceOnUse">
      <stop offset=".31" stop-color="#be34ad"/>
      <stop offset="1" stop-color="#e42b79"/>
    </linearGradient>
  </defs>

